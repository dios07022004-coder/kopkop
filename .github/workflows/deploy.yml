name: Deploy to Selectel

# Авто-деплой: при каждом push в main код обновляется на сервере и пересобирается.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /var/www/kopkop
            git pull origin main
            npm ci
            npm run build
            pm2 reload kopkop || pm2 start "npm run start" --name kopkop
            pm2 save
